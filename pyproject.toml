[project]
name = "kvmem"
version = "0.1.0"
description = "Key-value memory store"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax",
    "equinox",
    "tqdm>=4.67.3",
    "matplotlib>=3.10.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
